[package]
name = "ringer"
version = "0.1.0"
edition = "2021"
description = "Desktop countdown timer (GPUI) — Rust port of the Python timer"
license = "MIT"
publish = false

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 3

# xattr 0.2.3 (via gpui -> zed-async-tar) references libc::ENOATTR, which
# newer libc releases no longer define on Linux (required by rustix 1.x).
# Vendored with ENOATTR mapped to ENODATA (same errno value on Linux).
[patch.crates-io]
xattr = { path = "vendor/xattr" }
